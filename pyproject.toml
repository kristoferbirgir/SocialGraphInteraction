[project]
name = "social-graph-interaction"
version = "0.1.0"
description = "DTU Social Graphs and Interactions (02805) — group workspace: notebooks, helpers, and the Marvel dataset toolbox."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "jupyterlab>=4.2",
    "ipykernel>=6.29",
    "networkx>=3.3",
    "numpy>=2.0",
    "matplotlib>=3.9",
    "pandas>=2.2",
    "httpx>=0.27",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sgi"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
